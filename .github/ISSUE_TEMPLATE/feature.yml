name: Feature request
description: Suggest a focused improvement to a Forlæns project
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What user problem or opportunity should the project address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
      description: Who benefits, and what accessibility requirements should be considered?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workarounds or alternative approaches.
